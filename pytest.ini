[pytest]
# ─────────────────────────────────────────────────
#  pytest configuration for Amazon Selenium Tests
# ─────────────────────────────────────────────────

# Default flags applied on every run:
#   -v           → verbose output (show each test name)
#   -n 2         → run 2 workers in PARALLEL (pytest-xdist)
#   --html       → generate an HTML report after the run
#   --self-contained-html → embed assets so the report is a single file
addopts =
    -v
    -n 2
    --html=reports/test_report.html
    --self-contained-html

# Where pytest should look for tests
testpaths = tests

# Only collect files that match this pattern
python_files = test_*.py

# Only collect classes / functions that match these patterns
python_classes = Test*
python_functions = test_*

# Custom markers used in the test suite
markers =
    smoke:     Quick sanity checks
    regression: Full regression suite
    parallel:  Tests designed to run in parallel
